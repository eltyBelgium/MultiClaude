name: Release

# Push a tag like v1.0.0 to build macOS, Windows and Linux installers
# and attach them to a GitHub Release. Can also be started by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg zip --x64 --arm64
          - os: windows-latest
            args: --win nsis --x64 --arm64
          - os: ubuntu-latest
            args: --linux AppImage deb --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            Run several isolated Claude Desktop accounts side by side.

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `ClaudeProfiles-*-arm64.dmg` |
            | macOS (Intel) | `ClaudeProfiles-*-x64.dmg` |
            | Windows | `ClaudeProfiles-Setup-*-x64.exe` (or `-arm64`) |
            | Linux (Ubuntu / Debian) | `claude-profiles_*_amd64.deb` (or `_arm64`) |
            | Linux (any distro) | `ClaudeProfiles-*-x86_64.AppImage` |

            The builds are not code-signed. macOS: right-click the app and choose Open the first time. Windows: SmartScreen, click More info, then Run anyway.

            Independent tool. Not affiliated with or endorsed by Anthropic.
