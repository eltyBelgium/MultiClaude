name: Release

# Builds macOS, Windows and Linux installers on every push to main.
# When the version in package.json has no release yet, it publishes
# GitHub Release v<version> with all installers attached.
# To ship a new release: bump "version" in package.json and push.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # Tag exists: only release when this run was started by that tag.
            [ "$GITHUB_REF" = "refs/tags/$TAG" ] && R=true || R=false
          else
            R=true
          fi
          echo "release=$R" >> "$GITHUB_OUTPUT"
          echo "Version $TAG, release: $R"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg zip --x64 --arm64
          - os: windows-latest
            args: --win nsis --x64 --arm64
          - os: ubuntu-latest
            args: --linux AppImage deb --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: MultiClaude ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          generate_release_notes: true
          body: |
            Run several isolated Claude Desktop accounts side by side.

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `ClaudeProfiles-*-arm64.dmg` |
            | macOS (Intel) | `ClaudeProfiles-*-x64.dmg` |
            | Windows | `ClaudeProfiles-Setup-*-x64.exe` (or `-arm64`) |
            | Linux (Ubuntu / Debian) | `claude-profiles_*_amd64.deb` (or `_arm64`) |
            | Linux (any distro) | `ClaudeProfiles-*-x86_64.AppImage` |

            The builds are not code-signed. macOS: right-click the app and choose Open the first time. Windows: SmartScreen, click More info, then Run anyway.

            Independent tool. Not affiliated with or endorsed by Anthropic.
