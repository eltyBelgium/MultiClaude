name: Release

# Builds macOS, Windows and Linux installers on every push to main.
# When the version in package.json has no release yet, it publishes
# GitHub Release v<version> with all installers attached.
# To ship a new release: bump "version" in package.json and push.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # Tag exists: only release when this run was started by that tag.
            [ "$GITHUB_REF" = "refs/tags/$TAG" ] && R=true || R=false
          else
            R=true
          fi
          echo "release=$R" >> "$GITHUB_OUTPUT"
          echo "Version $TAG, release: $R"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg zip --x64 --arm64
          - os: windows-latest
            args: --win nsis --x64 --arm64
          - os: ubuntu-latest
            args: --linux AppImage deb --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Signing switches on per platform once its secrets exist.
      # macOS: CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
      # Windows: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (secrets) and
      #          AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE (variables)
      - name: Build installers
        shell: bash
        run: |
          EXTRA=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$CSC_LINK" ]; then echo "macOS: signing with Developer ID"; else
              echo "macOS: no certificate, ad-hoc signing"; unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
              export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZ_ENDPOINT" ]; then
              echo "Windows: signing with Azure Artifact Signing"
              EXTRA+=(-c.win.azureSignOptions.endpoint="$AZ_ENDPOINT"
                      -c.win.azureSignOptions.codeSigningAccountName="$AZ_ACCOUNT"
                      -c.win.azureSignOptions.certificateProfileName="$AZ_PROFILE")
            else
              echo "Windows: no Azure signing configured, building unsigned"
              unset AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET
            fi
          fi
          npx electron-builder ${{ matrix.args }} --publish never "${EXTRA[@]}"
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZ_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZ_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZ_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}

      - name: Verify macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for app in dist/mac*/*.app; do
            echo "== $app"; codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Signature|Authority|TeamIdentifier' || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: MultiClaude ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          generate_release_notes: true
          body: |
            Run several isolated Claude Desktop accounts side by side.

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `ClaudeProfiles-*-arm64.dmg` |
            | macOS (Intel) | `ClaudeProfiles-*-x64.dmg` |
            | Windows | `ClaudeProfiles-Setup-*-x64.exe` (or `-arm64`) |
            | Linux (Ubuntu / Debian) | `claude-profiles_*_amd64.deb` (or `_arm64`) |
            | Linux (any distro) | `ClaudeProfiles-*-x86_64.AppImage` |

            First launch on macOS (until the app is notarized): open the app once, then go to System Settings, Privacy & Security, and click Open Anyway.
            Windows (until the installer is signed): on the SmartScreen warning, click More info, then Run anyway.

            Independent tool. Not affiliated with or endorsed by Anthropic.
